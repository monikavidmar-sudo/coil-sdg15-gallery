<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Test SDG 15 gallery</title>
    <style>
      body { font-family: sans-serif; background:#16251e; color:#fff; padding: 32px; }
      .gallery { display:grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap:16px; margin-top:20px; }
      .gallery img { width:100%; height:260px; object-fit:cover; border-radius:12px; border:2px solid #506b58; }
    </style>
  </head>
  <body>
    <h1>Life on land in photographs</h1>
    <div class="gallery">
      <img src="https://raw.githubusercontent.com/monikavidmar-sudo/coil-sdg15-gallery/main/slike/multimediji2.png" alt="Life on land 2">
      <img src="https://raw.githubusercontent.com/monikavidmar-sudo/coil-sdg15-gallery/main/slike/multimediji3.png" alt="Life on land 3">
      <img src="https://raw.githubusercontent.com/monikavidmar-sudo/coil-sdg15-gallery/main/slike/multimediji5.png" alt="Life on land 5">
    </div>
  </body>
</html>
